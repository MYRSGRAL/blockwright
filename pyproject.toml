[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "blockwright"
version = "1.4.0"
description = "Компактные чёрно-белые блок-схемы учебных программ C++"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
keywords = ["flowchart", "блок-схема", "гост", "cpp", "svg", "tree-sitter"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Documentation",
    "Natural Language :: Russian",
]
dependencies = [
    "tree_sitter>=0.23",
    "tree_sitter_cpp>=0.23",
    "Pillow>=11.3",
]

[project.scripts]
blockwright = "blockwright.__main__:main"

[tool.setuptools]
packages = ["blockwright"]

[tool.setuptools.package-data]
blockwright = ["languages/*.toml"]
